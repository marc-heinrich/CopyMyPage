PLG_TASK_COPYMYPAGE_LEDGER_CLEANUP_DESC="Désactivé par défaut. Vérifie les tentatives PayPal propres sans nouvel encaissement. Les réservations vérifiées comme impayées peuvent être libérées. Utiliser le mode Exécution à blanc en premier."
